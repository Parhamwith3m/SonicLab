<style>

(--text);display:flex;justify-content:space-between;align-items:center}.choice-answer:hover{border-color:rgba(181,161,232,.5)}.choice-answer.selected{border-color:var(--violet);background:rgba(181,161,232,.1)}.choice-answer.correct{border-color:var(--green);background:rgba(138,198,160,.08)}.choice-answer.wrong{border-color:var(--red);background:rgba(223,142,145,.08)}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.feedback{padding:14px 16px;border-radius:13px;margin-top:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--sub)}.feedback.good{border-color:rgba(138,198,160,.25);color:var(--green);background:rgba(138,198,160,.07)}.feedback.bad{border-color:rgba(223,142,145,.25);color:var(--red);background:rgba(223,142,145,.07)}.progress-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.progress-bar span{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .2s}.violet-bar span{background:var(--violet)}.quiz-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.quiz-meta{font-size:12px;color:var(--muted)}.result-big{font-size:58px;line-height:1;font-weight:760;letter-spacing:-.06em;margin:8px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:20px 0}.result-grid .stat{background:rgba(17,24,32,.6)}.chart-bars{display:grid;gap:14px}.bar-row{display:grid;grid-template-columns:112px 1fr 42px;gap:12px;align-items:center;font-size:12px;color:var(--sub)}.bar{height:7px;background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;border-radius:20px;background:var(--blue)}.bar.violet span{background:var(--violet)}.setting-section{padding:20px 0;border-bottom:1px solid var(--line)}.setting-section:first-child{padding-top:0}.setting-section:last-child{border:0;padding-bottom:0}.setting-row{display:flex;justify-content:space-between;gap:20px;align-items:center;marg <div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Sonic Lab — standalone local-first music training app */
(() => {
'use strict';
const STORE='sonic-lab-v1';
const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const LETTERS=['C','D','E','F','G','A','B'];
const NATURAL={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const PATTERNS={
  major:{name:'Major',formula:[2,2,1],steps:[0,2,4,5]},
  minor:{name:'Minor',formula:[2,1,2],steps:[0,2,3,5]},
  harmonic:{name:'Harmonic Minor',formula:[1,3,1],steps:[0,1,4,5]},
  phrygian:{name:'Phrygian',formula:[1,2,2],steps:[0,1,3,5]}
};
const defaults={range:{low:43,high:64,confirmed:false},tolerance:10,sensitivity:0.012,listenRoot:67,playbackSpeed:1,quizDifficulty:'normal',replays:2,volume:0.65,stats:{sing:{attempts:0,correct:0,streak:0,bestStreak:0,byType:{},noteErrors:{}},listen:{rounds:0,correct:0,streak:0,bestStreak:0,byPattern:{},confusions:{},history:[]}},history:[],onboarded:false};
let data=loadData();
let route='home', previousRoute='home', arena='sing', singTab='practice', listenTab='practice';
let noteSelection={letter:'G',accidental:'natural',octave:3};
let sequence=[{midi:43,label:'G2'},{midi:45,label:'A2'},{midi:47,label:'B2'},{midi:48,label:'C3'}];
let activeExercise=null, session=null, audioCtx=null, micStream=null, analyser=null, micSource=null, raf=0, stableSince=0, recentFreq=[], detected=null, currentCents=0, micState='off', audioNodes=[];
let listeningPracticeIndex=0, listeningQuiz=null, singingQuiz=null, toastTimer=null;
const app=document.getElementById('app');
function loadData(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(STORE)||'{}')};}catch(e){return structuredClone(defaults)}}
function saveData(){try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){toast('Could not save local data in this browser.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
function midiName(m,flat=false){const n=((m%12)+12)%12;const names=flat?['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B']:NOTES;return names[n]+(Math.floor(m/12)-1)}
function frequencyMidi(f){return 69+12*Math.log2(f/440)}
function nearestMidi(f){return Math.round(frequencyMidi(f))}
function centsFrom(f,m){return Math.round(1200*Math.log2(f/midiFreq(m)))}
function midiFromSelection(sel=noteSelection){return 12*(Number(sel.octave)+1)+NATURAL[sel.letter]+({natural:0,sharp:1,flat:-1}[sel.accidental]||0)}
function labelFromSelection(sel=noteSelection){const a={natural:'',sharp:'♯',flat:'♭'}[sel.accidental];return sel.letter+a+sel.octave}
function selectionFromMidi(m){const n=((m%12)+12)%12;return {letter:['C','C','D','D','E','F','F','G','G','A','A','B'][n],accidental:['natural','sharp','natural','sharp','natural','natural','sharp','natural','sharp','natural','sharp','natural'][n],octave:Math.floor(m/12)-1}}
function patternMidis(root,key){return PATTERNS[key].steps.map(x=>root+x)}
function patternNotes(root,key){return patternMidis(root,key).map(m=>midiName(m))}
function listeningRootOptions(selected){let html='';for(let octave=2;octave<=6;octave++){const first=12*(octave+1);html+=`<optgroup label="Octave ${octave}">`+Array.from({length:12},(_,i)=>first+i).map(m=>`<option value="${m}" ${m===selected?'selected':''}>${midiName(m)}</option>`).join('')+'</optgroup>'}return html}
function randomInt(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function randomPattern(){return Object.keys(PATTERNS)[randomInt(0,3)]}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function icon(name){return ({home:'⌂',sing:'◉',listen:'◌',stats:'▥',settings:'⚙',back:'←',play:'▶',pause:'Ⅱ',mic:'●',ear:'◖',note:'♫'})[name]||'·'}
function button(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function backLink(label='Back'){return `<div class="back-line"><button class="back-link" data-action="back">← ${label}</button></div>`}
function heading(eyebrow,title,desc='',violet=false){return `<div class="screen-title"><p class="eyebrow ${violet?'violet':''}">${eyebrow}</p><h2>${title}</h2>${desc?`<p class="lead">${desc}</p>`:''}</div>`}
function shell(content){const crumbs=route==='home'?'Overview':route==='settings'?'Settings':route==='stats'?'Progress':route.includes('sing')?'Singing Arena':route.includes('listen')?'Listening Arena':'Sonic Lab';return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">S</div><div><div class="brand-name">Sonic Lab</div><div class="brand-sub">Music training</div></div></div><div><div class="nav-label">Workspace</div><div class="nav-group"><button class="nav-btn ${route==='home'?'active':''}" data-action="home"><span class="nav-icon">⌂</span>Overview</button><button class="nav-btn ${route.includes('sing')?'active':''}" data-action="open-sing"><span class="nav-icon">◉</span>Singing Arena</button><button class="nav-btn ${route.includes('listen')?'active':''}" data-action="open-listen"><span class="nav-icon">◌</span>Listening Arena</button></div></div><div><div class="nav-label">Personal</div><div class="nav-group"><button class="nav-btn ${route==='stats'?'active':''}" data-action="stats"><span class="nav-icon">▥</span>Progress</button><button class="nav-btn ${route==='settings'?'active':''}" data-action="settings"><span class="nav-icon">⚙</span>Settings</button></div></div><div class="side-bottom"><div class="local-note"><strong>◉ Stored on this device</strong>Your settings and training history stay in this browser. No account needed.</div><div class="tiny" style="padding:0 10px">SONIC LAB · 1.3</div></div></aside><main class="main"><header class="topbar"><div class="crumb">${crumbs}</div><div class="top-actions"><button class="icon-btn" data-action="settings" aria-label="Settings">⚙</button></div></header><div class="content">${content}<div class="footer-hint">Local-first audio training · A4 = 440 Hz</div></div></main></div><nav class="mobile-nav"><button class="${route==='home'?'active':''}" data-action="home"><span>⌂</span>Home</button><button class="${route.includes('sing')?'active':''}" data-action="open-sing"><span>◉</span>Sing</button><button class="${route.includes('listen')?'active':''}" data-action="open-listen"><span>◌</span>Listen</button><button class="${route==='stats'?'active':''}" data-action="stats"><span>▥</span>Progress</button></nav>`}
function homeView(){const s=data.stats.sing,l=data.stats.listen;return `<section class="hero"><div class="hero-copy"><p class="eyebrow">A personal music studio</p><h1>Train your ears.<br><span>Control your voice.</span></h1><p class="lead">A focused space to recognise musical patterns and turn what you hear into accurate vocal performance.</p><div class="hero-actions">${button('Open Singing Arena','open-sing','btn primary')}${button('Explore Listening Arena','open-listen','btn ghost')}</div></div></section><div class="section-head"><div><h2>Your training</h2><p>A quiet look at your progress so far.</p></div><span class="tag">Saved locally</span></div><div class="stats-row"><div class="stat"><div class="stat-value">${s.attempts}</div><div class="stat-label">Singing attempts</div></div><div class="stat"><div class="stat-value">${l.rounds}</div><div class="stat-label">Listening rounds</div></div><div class="stat"><div class="stat-value">${s.attempts?Math.round(s.correct/s.attempts*100):0}%</div><div class="stat-label">Singing accuracy</div></div><div class="stat"><div class="stat-value">${l.rounds?Math.round(l.correct/l.rounds*100):0}%</div><div class="stat-label">Listening accuracy</div></div></div><div class="section-head"><div><h2>Choose your arena</h2><p>Two skills, trained independently.</p></div></div><div class="arena-grid"><button class="arena-card" data-action="open-sing"><div class="symbol">◉</div><h2>Singing Arena</h2><p>Find a pitch, reproduce it, and build control over individual notes and short sequences.</p><span class="card-link">Enter Singing Arena&nbsp; →</span></button><button class="arena-card violet-card" data-action="open-listen"><div class="symbol">◌</div><h2>Listening Arena</h2><p>Hear the difference between four musical patterns and learn their interval character.</p><span class="card-link">Enter Listening Arena&nbsp; →</span></button></div><div class="section-head"><div><h2>Quick access</h2><p>Continue with a focused session.</p></div></div><div class="choice-grid"><button class="choice-card" data-action="sing-practice"><div class="mini-icon" style="color:var(--blue)">♫</div><h3>Vocal practice</h3><p>Single notes, sequences and pitch matching.</p></button><button class="choice-card violet" data-action="listen-practice"><div class="mini-icon" style="color:var(--violet)">耳</div><h3>Pattern comparison</h3><p>Compare Major, Minor, Harmonic Minor and Phrygian.</p></button></div>`}
function arenaView(which){const isSing=which==='sing';return `${backLink('Overview')}${heading(isSing?'BLUE / VOICE':'VIOLET / EAR',isSing?'Singing Arena':'Listening Arena',isSing?'Turn a target pitch into a controlled vocal performance.':'Train your ear to recognise the shape of a four-note pattern.',!isSing)}<div class="choice-grid"><button class="choice-card ${isSing?'':'violet'}" data-action="${isSing?'sing-practice':'listen-practice'}"><div class="mini-icon" style="color:${isSing?'var(--blue)':'var(--violet)'}">▶</div><h3>Practice</h3><p>${isSing?'Work at your own pace with manual targets and immediate pitch feedback.':'Compare the four patterns with a chosen root and unlimited replays.'}</p></button><button class="choice-card ${isSing?'':'violet'}" data-action="${isSing?'sing-quiz':'listen-quiz'}"><div class="mini-icon" style="color:${isSing?'var(--blue)':'var(--violet)'}">◎</div><h3>Quiz</h3><p>${isSing?'Take generated vocal challenges and review your accuracy.':'Identify patterns by ear, with a harder mode that asks for the root too.'}</p></button></div><div class="section-head"><div><h2>At a glance</h2><p>${isSing?'Your comfortable range and vocal practice':'Your listening practice and pattern recognition'}</p></div></div>${isSing?`<div class="panel"><div class="range-box"><div class="range-card"><span class="tiny">LOWEST COMFORTABLE</span><strong>${data.range.confirmed?midiName(data.range.low):'Not set'}</strong></div><div class="range-card"><span class="tiny">HIGHEST COMFORTABLE</span><strong>${data.range.confirmed?midiName(data.range.high):'Not set'}</strong></div></div><div class="control-row" style="margin-top:16px">${button('Adjust vocal range','onboarding','btn ghost')}<span class="tiny">${data.range.confirmed?'Range saved':'Range not yet confirmed'}</span></div></div>`:`<div class="panel"><div class="section-head" style="margin:0 0 14px"><div><h3>The four patterns</h3><p>Same root. Different interval structure.</p></div><span class="tag violet">4 notes each</span></div><div class="pattern-grid">${Object.entries(PATTERNS).map(([k,p])=>`<div class="pattern-card"><div class="pattern-name">${p.name}</div><div class="pattern-notes">${p.formula.join(' – ')} semitones</div></div>`).join('')}</div></div>`}`}
function practiceMenu(){return `${backLink('Singing Arena')}${heading('SINGING / PRACTICE','Choose an exercise','Manual targets. No pressure, no score — just focused repetition.')}<div class="choice-grid"><button class="choice-card" data-action="sing-single"><div class="mini-icon" style="color:var(--blue)">◉</div><h3>Single Note</h3><p>Choose an exact note and octave. Sing it and see how close you are in cents.</p></button><button class="choice-card" data-action="sing-sequence"><div class="mini-icon" style="color:var(--blue)">♫</div><h3>Note Sequence</h3><p>Build a short sequence and move through it one accurate note at a time.</p></button><button class="choice-card" data-action="sing-match"><div class="mini-icon" style="color:var(--blue)">♪</div><h3>Pitch Matching</h3><p>Hear a piano reference, remember it, then reproduce it with your voice.</p></button></div>`}
function quizMenu(){return `${backLink('Singing Arena')}${heading('SINGING / QUIZ','Choose a challenge','Targets are generated within your saved comfortable vocal range.')}<div class="choice-grid"><button class="choice-card" data-action="quiz-single"><div class="mini-icon" style="color:var(--blue)">◉</div><h3>Single Note Challenge</h3><p>Sing a visible target. Octave and pitch accuracy both count.</p></button><button class="choice-card" data-action="quiz-sequence"><div class="mini-icon" style="color:var(--blue)">♫</div><h3>Sequence Challenge</h3><p>Sing one of the four ascending patterns from a root you choose.</p></button><button class="choice-card" data-action="quiz-match"><div class="mini-icon" style="color:var(--blue)">♪</div><h3>Pitch Matching Challenge</h3><p>Reproduce a piano note from memory with a limited replay allowance.</p></button></div>`}
function noteSelector(prefix='sel',sel=noteSelection){return `<div class="form-row"><div class="field"><label for="${prefix}-letter">Note</label><select id="${prefix}-letter" data-note-part="letter">${LETTERS.map(x=>`<option ${sel.letter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="${prefix}-octave">Octave</label><select id="${prefix}-octave" data-note-part="octave">${Array.from({length:9},(_,i)=>i).map(x=>`<option value="${x}" ${Number(sel.octave)===x?'selected':''}>${x}</option>`).join('')}</select><span class="field-help">Octaves 0–8 · e.g. G2, G3, G4</span></div><div class="field"><label for="${prefix}-acc">Sharp / Flat</label><select id="${prefix}-acc" data-note-part="accidental"><option value="natural" ${sel.accidental==='natural'?'selected':''}>Natural</option><option value="sharp" ${sel.accidental==='sharp'?'selected':''}>Sharp (♯)</option><option value="flat" ${sel.accidental==='flat'?'selected':''}>Flat (♭)</option></select></div></div>`}
function singlePracticeView(){return `${backLink('Practice')}${heading('SINGLE NOTE','Find the pitch','Choose a target. The tuner checks the exact note and octave.') }<div class="panel"><div style="max-width:650px;margin:auto"><p class="eyebrow">Target selection</p>${noteSelector()}<div id="range-warning" class="feedback bad" style="display:${data.range.confirmed&&!withinRange(midiFromSelection())?'block':'none'}">This target is outside your saved comfortable range. You can still use it, but it may feel strenuous.</div><div class="note-display" id="target-note">${labelFromSelection()}</div><div class="target-label">Target pitch · exact octave matters</div><div class="center" style="margin-top:22px">${button('Start listening','start-single','btn primary')} ${button('Stop','stop-mic','btn ghost')}</div><div id="mic-status" class="status-line"><span class="dot"></span> Microphone is off</div><div id="pitch-meter-area"></div><p class="tiny center" style="margin-top:15px">Target must remain within ±${data.tolerance} cents steadily before it is accepted.</p></div></div><div class="microphone-note"><span>ⓘ</span><div><strong>Microphone privacy.</strong> Audio is analysed locally in this browser and is never uploaded. Your browser may ask for microphone permission when you start.</div></div>`}
function sequencePracticeView(){if(sequence.length)noteSelection=selectionFromMidi(sequence[sequence.length-1].midi);return `${backLink('Practice')}${heading('NOTE SEQUENCE','Build your phrase','Add exact notes and sing them in order. Each target advances only after a stable match.')}<div class="panel"><p class="eyebrow">Sequence builder</p><div class="sequence-builder"><div>${noteSelector('seq')}<div id="range-warning" class="feedback bad" style="display:${data.range.confirmed&&!withinRange(midiFromSelection())?'block':'none'}">This note is outside your saved comfortable range.</div></div>${button('+ Add note','add-seq','btn ghost')}</div><div class="sequence-list" id="sequence-list">${sequence.map((n,i)=>`<div class="seq-chip"><span>${i+1}. ${n.label}</span><button data-action="remove-seq" data-index="${i}" aria-label="Remove note">×</button></div>`).join('')}</div><div class="control-row">${button('Clear','clear-seq','btn ghost')}${button('Start sequence','start-sequence','btn primary')}${button('Stop','stop-mic','btn ghost')}</div><div class="divider"></div><div class="target-label">CURRENT TARGET</div><div class="note-display" id="target-note">${sequence[0]?.label||'—'}</div><div class="center tiny" id="sequence-progress">${sequence.length?`0 of ${sequence.length} notes completed`:'Add notes to begin.'}</div><div id="sequence-chips-active"></div><div id="mic-status" class="status-line"><span class="dot"></span> Microphone is off</div><div id="pitch-meter-area"></div></div>`}
function pitchMatchView(){return `${backLink('Practice')}${heading('PITCH MATCHING','Hear it. Hold it. Sing it.','The reference stops before the microphone evaluates your voice.')}<div class="panel center"><p class="eyebrow">Reference note</p>${noteSelector()}<div id="range-warning" class="feedback bad" style="display:${data.range.confirmed&&!withinRange(midiFromSelection())?'block':'none'}">This target is outside your saved comfortable range. You can still use it, but it may feel strenuous.</div><div class="note-display" id="target-note">${labelFromSelection()}</div><div class="target-label">Selected reference</div><div class="control-row" style="justify-content:center;margin:22px 0">${button('Play reference','play-reference','btn primary')}${button('Start singing','start-match','btn ghost')}${button('Stop','stop-mic','btn ghost')}</div><div id="mic-status" class="status-line"><span class="dot"></span> Waiting for reference note</div><div id="pitch-meter-area"></div></div><p class="tiny center" style="margin-top:13px">The reference uses sampled acoustic-grand-piano audio. Playback stops before pitch detection begins.</p>`}
function singQuizSetup(type){const title={single:'Single Note Challenge',sequence:'Sequence Challenge',match:'Pitch Matching Challenge'}[type];return `${backLink('Singing Quiz')}${heading('SINGING / QUIZ',title,'A 10-round session. Targets stay inside your saved comfortable range.')}<div class="panel"><div class="setting-section"><h3>Session setup</h3><div class="setting-row"><div><strong>Rounds</strong><p>Fixed for this first version.</p></div><span class="tag">10 rounds</span></div>${type==='sequence'?`<div class="setting-row"><div><strong>Root note</strong><p>Choose a starting note and octave.</p></div><div class="field" style="width:155px"><select id="quiz-root">${validRoots().map(m=>`<option value="${m}" ${m===data.range.low?'selected':''}>${midiName(m)}</option>`).join('')}</select></div></div><p class="tiny">The four-note pattern is selected at random. The full sequence must fit your comfortable range. ${validRoots().length?'':'Your saved range is narrower than five semitones, so this challenge is unavailable.'}</p>`:''}<div class="setting-row"><div><strong>Pitch tolerance</strong><p>Current acceptance window.</p></div><span class="tag">±${data.tolerance} cents</span></div></div><div class="control-row" style="margin-top:18px">${button('Start 10-round quiz','start-sing-quiz',`btn primary`) }</div></div>`}
function validRoots(){let arr=[];for(let m=Math.max(24,data.range.low);m<=Math.min(95,data.range.high-5);m++){arr.push(m)}return arr}
function listenPracticeView(){const root=data.listenRoot;return `${backLink('Listening Arena')}${heading('LISTENING / PRACTICE','Compare the four patterns','Choose any root from C2 to B6. Practise the same four patterns in different registers.',true)}<div class="panel"><div class="control-row" style="justify-content:space-between;align-items:end"><div class="field" style="width:220px"><label for="listen-root">Root note · exact octave</label><select id="listen-root">${listeningRootOptions(root)}</select><span class="field-help">C2–B6 · five full octaves</span></div><div class="field" style="width:165px"><label for="listen-speed">Playback speed</label><select id="listen-speed"><option value="0.7" ${data.playbackSpeed===.7?'selected':''}>Slow</option><option value="1" ${data.playbackSpeed===1?'selected':''}>Normal</option><option value="1.25" ${data.playbackSpeed===1.25?'selected':''}>Fast</option></select></div><div class="control-row">${button('Play all four','play-all-patterns','btn violet')}</div></div><div class="divider"></div><div class="pattern-grid">${Object.entries(PATTERNS).map(([key,p],i)=>`<div class="pattern-card" id="pattern-${key}"><div style="display:flex;justify-content:space-between;gap:8px"><div class="pattern-name">${p.name}</div><span class="tag violet">${p.formula.join('–')}</span></div><div class="pattern-notes">${patternNotes(root,key).join(' → ')}</div><div class="control-row" style="margin-top:13px"><button class="quiet-btn" data-action="play-pattern" data-pattern="${key}">▶ Play pattern</button></div><div class="tiny" id="pattern-status-${key}" style="margin-top:8px">Ready</div></div>`).join('')}</div><div class="control-row" style="margin-top:18px">${button('Stop playback','stop-audio','btn ghost')}${button('Play all again','play-all-patterns','btn ghost')}</div></div><p class="tiny center" style="margin-top:14px">These are four individual ascending notes, not chords. Every card uses the selected root and octave. Playback speed changes timing, never pitch.</p>`}
function listenQuizSetup(){return `${backLink('Listening Arena')}${heading('LISTENING / QUIZ','Test your ear','Identify a pattern from sound alone. No answer is revealed until you submit.',true)}<div class="panel"><h3>Choose difficulty</h3><div class="choice-grid" style="margin-top:15px"><button class="choice-card ${data.quizDifficulty==='normal'?'violet':''}" data-action="difficulty" data-value="normal"><span class="tag violet">STANDARD</span><h3 style="margin-top:12px">Pattern only</h3><p>Identify which of the four patterns you heard.</p></button><button class="choice-card ${data.quizDifficulty==='hard'?'violet':''}" data-action="difficulty" data-value="hard"><span class="tag violet">HARD</span><h3 style="margin-top:12px">Root + pattern</h3><p>Identify both the starting note and the pattern.</p></button></div><div class="setting-row"><div><strong>Rounds</strong><p>Ten randomised questions, with roots across C2–B6.</p></div><span class="tag">10 rounds</span></div><div class="setting-row"><div><strong>Replay allowance</strong><p>Replays per question.</p></div><select id="replay-count"><option value="0" ${data.replays===0?'selected':''}>None</option><option value="1" ${data.replays===1?'selected':''}>1 replay</option><option value="2" ${data.replays===2?'selected':''}>2 replays</option><option value="3" ${data.replays===3?'selected':''}>3 replays</option><option value="99" ${data.replays===99?'selected':''}>Unlimited</option></select></div><div class="control-row" style="margin-top:20px">${button('Start listening quiz','start-listen-quiz','btn violet')}</div></div>`}
function listenQuizView(){if(!listeningQuiz)return listenQuizSetup();const q=listeningQuiz;const hard=q.difficulty==='hard';return `${backLink('End quiz') }<div class="quiz-head"><div><p class="eyebrow violet">LISTENING / QUIZ</p><h2>Identify the pattern</h2><div class="quiz-meta">Round ${q.index+1} of 10 · ${q.correct} correct</div></div><span class="tag violet">${hard?'Hard · Root + pattern':'Standard · Pattern only'}</span></div><div class="progress-bar violet-bar"><span style="width:${q.index/10*100}%"></span></div><div class="panel center" style="margin-top:20px"><p class="eyebrow violet">Listen carefully</p><div style="font-size:40px;margin:10px 0;color:var(--violet)">♫</div><p class="muted">Four ascending notes · Same root structure</p><div class="control-row" style="justify-content:center;margin:18px 0">${button('▶ Play pattern','replay-listen-question','btn violet')}<span class="tag">${q.replaysLeft===99?'∞':q.replaysLeft+' replays left'}</span></div><div id="listen-play-status" class="tiny">${q.played?'Audio played':'Press play to hear the question'}</div></div><div class="panel" style="margin-top:14px"><h3>Your answer</h3>${hard?`<div class="field" style="margin:14px 0"><label for="answer-root">Root note</label><select id="answer-root"><option value="">Choose root…</option>${NOTES.map((n,i)=>`<option value="${i}" ${q.answerRoot===i?'selected':''}>${n}</option>`).join('')}</select></div>`:''}<div class="answer-grid" style="margin-top:13px">${Object.entries(PATTERNS).map(([k,p])=>`<button class="choice-answer ${q.answer===k?'selected':''} ${q.submitted&&k===q.pattern?'correct':''} ${q.submitted&&q.answer===k&&q.answer!==q.pattern?'wrong':''}" data-action="answer-pattern" data-pattern="${k}" ${q.submitted?'disabled':''}><span>${p.name}</span><span>${q.submitted&&k===q.pattern?'✓':'›'}</span></button>`).join('')}</div>${q.submitted?`<div class="feedback ${q.isCorrect?'good':'bad'}">${q.isCorrect?'Correct. Nice listening.':`Not quite. The answer was ${PATTERNS[q.pattern].name}.`}<div class="tiny" style="margin-top:6px;color:inherit">Notes: ${patternNotes(q.root,q.pattern).join(' → ')} · Root: ${midiName(q.root)}</div></div><div class="control-row" style="margin-top:17px">${button(q.index===9?'See results':'Next round','next-listen-question','btn violet')}</div>`:`<div class="control-row" style="margin-top:17px">${button('Submit answer','submit-listen-answer','btn violet')}</div>`}</div>`}
function singQuizView(){if(!singingQuiz)return quizMenu();const q=singingQuiz;const type=q.type;return `${backLink('End quiz')}<div class="quiz-head"><div><p class="eyebrow">SINGING / QUIZ</p><h2>${{single:'Single Note Challenge',sequence:'Sequence Challenge',match:'Pitch Matching Challenge'}[type]}</h2><div class="quiz-meta">Round ${q.index+1} of 10 · ${q.correct} correct</div></div><span class="tag blue">±${data.tolerance} cents</span></div><div class="progress-bar"><span style="width:${q.index/10*100}%"></span></div><div class="panel center" style="margin-top:20px"><p class="eyebrow">${type==='match'?'Listen, remember, reproduce':'Sing the target'}</p><div id="sing-quiz-target">${type==='match'?`<div class="note-display">? <span class="octave">?</span></div><div class="target-label">Hidden target · listen to the reference</div>`:type==='sequence'?`<div class="note-display" style="font-size:48px">${midiName(q.notes[q.noteIndex])}</div><div class="target-label">Note ${q.noteIndex+1} of 4 · ${PATTERNS[q.pattern].name}</div><div class="sequence-list" style="justify-content:center">${q.notes.map((m,i)=>`<span class="seq-chip ${i<q.noteIndex?'done':i===q.noteIndex?'active':''}">${i<q.noteIndex?'✓ ':''}${midiName(m)}</span>`).join('')}</div>`:`<div class="note-display">${midiName(q.target)}</div><div class="target-label">Target note · exact octave</div>`}</div><div class="control-row" style="justify-content:center;margin:18px 0">${type==='match'?button(q.referencePlayed?'Replay reference':'Play reference','quiz-play-reference','btn primary'):''}${type==='match'?`<span class="tag">${q.replaysLeft===99?'∞':q.replaysLeft+' replays left'}</span>`:''}${button(q.running?'Stop':'Start microphone',q.running?'stop-quiz-mic':'start-quiz-mic',`btn ${q.running?'ghost':'primary'}`)}</div><div id="mic-status" class="status-line"><span class="dot ${q.running?'live':''}"></span>${q.running?'Microphone active':'Microphone is off'}</div><div id="pitch-meter-area"></div><div id="quiz-feed async function loadPiano(){

    await Tone.start();
    if(pianoSampler&&pianoLoading)return await pianoLoading;
    if(pianoSampler)return pianoSampler;
    if(!pianoLoading){
      pianoSampler=new Tone.Sampler({urls:SALAMANDER_SAMPLES,baseUrl:'https://tonejs.github.io/audio/salamander/',release:.38,volume:-4}).toDestination();

    }

    pianoSampler=null;pianoLoading=null;
    toast('Real piano samples could not load. Check your connection and try again.');
    return null;
  }
}

}

function startSequence(){if(!sequence.length){toast('Add at least one note first.');return}activeExercise={type:'sequence',index:0,completed:0,done:false};renderSequenceProgress();updateSequenceTarget();document.getElementById('pitch-meter-area').innerHTML=meterMarkup();startMic().then(ok=>{if(!ok)return;updateMicStatus();listenLoop(reading=>{const target=sequence[activeExercise.index]?.midi;if(target==null)return;updateMeter(target,reading);if(noteAccepted(reading,target)){if(!stableSince)stableSince=performance.now();if(performance.now()-stableSince>550){trackSingResult('sequence',target,reading,true);activeExercise.index++;stableSince=0;if(activeExercise.index>=sequence.length){stopMic();document.getElementById('target-note').textContent='✓';document.getElementById('sequence-progress').textContent=`Sequence complete · ${sequence.length} notes`;document.querySelectorAll('[data-seq-chip]').forEach(el=>{el.classList.remove('active');el.classList.add('done')});toast('Sequence completed!');return}updateSequenceTarget();}}else stableSince=0})})}
function renderSequenceProgress(){const list=document.getElementById('sequence-chips-active');if(list)list.innerHTML=`<div class="sequence-list" style="justify-content:center">${sequence.map((n,i)=>`<span class="seq-chip" data-seq-chip="${i}">${i+1}. ${n.label}</span>`).join('')}</div>`}
function updateSequenceTarget(){const i=activeExercise.index;const target=sequence[i];document.getElementById('target-note').textContent=target.label;document.getElementById('sequence-progress').textContent=`${i} of ${sequence.length} notes completed`;document.querySelectorAll('[data-seq-chip]').forEach(el=>{const n=Number(el.dataset.seqChip);el.classList.toggle('done',n<i);el.classList.toggle('active',n===i)})}
function playReference(){const midi=midiFromSelection();stopAudio();const status=document.getElementById('mic-status');if(status)status.innerHTML='<span class="dot"></span> Loading acoustic piano…';playTone(midi,.85).then(ok=>{if(ok&&status)status.innerHTML='<span class="dot live"></span> Playing piano reference · microphone off'})}
function startMatch(){const target=midiFromSelection();stopAudio();const status=document.getElementById('mic-status');if(status)status.innerHTML='<span class="dot"></span> Loading acoustic piano…';playTone(target,.65).then(ok=>{if(!ok||route!=='sing-match')return;if(status)status.innerHTML='<span class="dot"></span> Reference finished · sing the note';setTimeout(()=>{if(route!=='sing-match')return;document.getElementById('pitch-meter-area').innerHTML=meterMarkup();startMic().then(ok=>{if(!ok)return;listenLoop(reading=>{updateMeter(target,reading);if(noteAccepted(reading,target)){if(!stableSince)stableSince=performance.now();if(performance.now()-stableSince>650){trackSingResult('match',target,reading,true);stopMic();const r=document.getElementById('meter-readout');if(r)r.innerHTML='<strong style="color:var(--green)">Matched · held steadily ✓</strong>';toast('Pitch matched!')}}else stableSince=0})})},750)})}
function withinRange(m){return m>=data.range.low&&m<=data.range.high}
function generateSingTarget(){if(data.range.high<data.range.low)return data.range.low;return randomInt(data.range.low,data.range.high)}
function startSingQuiz(type){if(type==='sequence'&&!validRoots().length){toast('Your comfortable range needs to span at least five semitones for this challenge.');return}const root=type==='sequence'?Number(document.getElementById('quiz-root')?.value||data.range.low):null;const notes=type==='sequence'?patternMidis(root,randomPattern()):null;const pattern=type==='sequence'?Object.keys(PATTERNS).find(k=>JSON.stringify(patternMidis(root,k))===JSON.stringify(notes)):null;singingQuiz={type,index:0,correct:0,results:[],target:generateSingTarget(),root,pattern,notes,noteIndex:0,referencePlayed:false,running:false,complete:false,feedback:'',attemptDone:false,replaysLeft:data.replays};if(type==='sequence'){let keys=Object.keys(PATTERNS);singingQuiz.pattern=randomPattern();singingQuiz.notes=patternMidis(root,singingQuiz.pattern);if(singingQuiz.notes.some(m=>!withinRange(m))){const candidates=validRoots().filter(m=>patternMidis(m,singingQuiz.pattern).every(withinRange));if(candidates.length){singingQuiz.root=candidates[0];singingQuiz.notes=patternMidis(candidates[0],singingQuiz.pattern)}}}if(type==='match')singingQuiz.target=generateSingTarget();go('sing-quiz-run')}
function updateSingQuizSequenceDisplay(){const q=singingQuiz,el=document.getElementById('sing-quiz-target');if(!q||q.type!=='sequence'||!el)return;el.innerHTML=`<div class="note-display" style="font-size:48px">${midiName(q.notes[q.noteIndex])}</div><div class="target-label">Note ${q.noteIndex+1} of 4 · ${PATTERNS[q.pattern].name}</div><div class="sequence-list" style="justify-content:center">${q.notes.map((m,i)=>`<span class="seq-chip ${i<q.noteIndex?'done':i===q.noteIndex?'active':''}">${i<q.noteIndex?'✓ ':''}${midiName(m)}</span>`).join('')}</div>`}
function startQuizMic(){if(!singingQuiz||singingQuiz.complete)return;const q=singingQuiz;if(q.type==='match'&&!q.referencePlayed){toast('Play the reference note before singing.');return}if(q.type==='match'&&Date.now()<(q.referenceEndsAt||0)){toast('Wait for the reference note to finish.');return}q.running=true;const st=document.getElementById('mic-status');if(st)st.innerHTML='<span class="dot live"></span> Requesting microphone…';document.getElementById('pitch-meter-area').innerHTML=meterMarkup();startMic().then(ok=>{if(!ok){q.running=false;return}updateMicStatus();listenLoop(reading=>{const target=q.type==='sequence'?q.notes[q.noteIndex]:q.target;updateMeter(target,reading);if(noteAccepted(reading,target)){if(!stableSince)stableSince=performance.now();if(performance.now()-stableSince>600){stableSince=0;if(q.type==='sequence'){q.noteIndex++;if(q.noteIndex>=q.notes.length){finishSingRound(true,0);return}updateSingQuizSequenceDisplay();}else{finishSingRound(true,Math.abs(centsFrom(reading.frequency,target)));}}}else stableSince=0})})}
function stopQuizMic(){if(singingQuiz&&singingQuiz.running){finishSingRound(false,0);return}stopMic()}
function finishSingRound(success,cents){const q=singingQuiz;if(!q||q.complete)return;q.running=false;stopMic();q.complete=true;q.attemptDone=true;q.feedback=success?'Target reached and held steadily.':'Attempt ended before a stable match.';q.results.push({success,target:q.target,cents});if(success)q.correct++;trackSingResult(q.type,q.type==='sequence'?(q.notes?.[q.noteIndex]??q.root):q.target,q.type==='sequence'||cents==null?null:{cents},success);render();}
function playQuizReference(){if(!singingQuiz)return;const q=singingQuiz;if(q.referenceLoading)return;if(q.referencePlayed&&q.replaysLeft===0){toast('No replays remaining.');return}if(q.referencePlayed&&q.replaysLeft!==99)q.replaysLeft--;q.referencePlayed=false;q.referenceLoading=true;q.referenceEndsAt=Date.now()+999999;stopAudio();const st=document.getElementById('mic-status');if(st)st.innerHTML='<span class="dot"></span> Loading acoustic piano…';playTone(q.target,.65).then(ok=>{if(singingQuiz!==q)return;q.referenceLoading=false;if(!ok){q.referencePlayed=false;return}q.referencePlayed=true;q.referenceEndsAt=Date.now()+650;if(st)st.innerHTML='<span class="dot"></span> Reference playing · wait for it to finish'});}
function nextSingQuestion(){const q=singingQuiz;if(!q)return;if(q.index>=9){showSingResults();return}q.index++;q.complete=false;q.feedback='';q.noteIndex=0;q.attemptDone=false;q.referencePlayed=false;q.replaysLeft=data.replays;q.target=generateSingTarget();if(q.type==='sequence'){q.pattern=randomPattern();let candidates=validRoots().filter(m=>patternMidis(m,q.pattern).every(withinRange));if(!candidates.length){toast('No four-note sequence fits your saved range.');q.complete=true;return}q.root=candidates[randomInt(0,candidates.length-1)];q.notes=patternMidis(q.root,q.pattern)}render()}
function showSingResults(){const q=singingQuiz;const pct=Math.round(q.correct/10*100);route='sing-quiz-results';app.innerHTML=shell(`${backLink('Singing Arena')}${heading('SESSION COMPLETE','Your singing results',`${q.correct} of 10 rounds completed successfully.`)}<div class="panel center"><p class="eyebrow">FINAL SCORE</p><div class="result-big">${pct}%</div><p class="muted">${q.correct} successful · ${10-q.correct} not completed</p><div class="result-grid"><div class="stat"><div class="stat-value">10</div><div class="stat-label">Rounds</div></div><div class="stat"><div class="stat-value">${q.correct}</div><div class="stat-label">Successful</div></div><div class="stat"><div class="stat-value">${pct}%</div><div class="stat-label">Accuracy</div></div></div><div class="control-row" style="justify-content:center">${button('Try another quiz','sing-quiz','btn primary')}${button('Back to arena','open-sing','btn ghost')}</div></div>`)}
function startListenQuiz(){const q={difficulty:data.quizDifficulty,index:0,correct:0,pattern:randomPattern(),root:36+randomInt(0,59),answer:null,answerRoot:null,submitted:false,isCorrect:false,played:false,replaysLeft:data.replays};listeningQuiz=q;go('listen-quiz');}
function playListenQuestion(){if(!listeningQuiz)return;const q=listeningQuiz;if(q.loading)return;if(q.replaysLeft===0&&q.played){toast('No replays remaining.');return}if(q.played&&q.replaysLeft!==99)q.replaysLeft--;q.loading=true;render();const status=document.getElementById('listen-play-status');if(status)status.textContent='Loading piano samples…';const generation=audioGeneration;schedulePattern(q.root,q.pattern,0,generation).then(ms=>{if(listeningQuiz!==q)return;q.loading=false;q.played=ms>0;const el=document.getElementById('listen-play-status');if(el)el.textContent=ms>0?'Audio played':'Piano unavailable'})}
function submitListenAnswer(){const q=listeningQuiz;if(!q||q.submitted)return;if(!q.played){toast('Play the pattern before submitting your answer.');return}if(!q.answer){toast('Choose a pattern first.');return}const hard=q.difficulty==='hard';if(hard&&q.answerRoot==null){toast('Choose the root note too.');return}q.isCorrect=q.answer===q.pattern&&(!hard||q.answerRoot===q.root%12);q.submitted=true;if(q.isCorrect)q.correct++;const l=data.stats.listen;l.rounds++;if(q.isCorrect){l.correct++;l.streak++;l.bestStreak=Math.max(l.bestStreak,l.streak)}else{l.streak=0;if(q.answer&&q.answer!==q.pattern){const pair=[q.pattern,q.answer].sort().join('|');l.confusions[pair]=(l.confusions[pair]||0)+1}}const b=l.byPattern[q.pattern]||(l.byPattern[q.pattern]={attempts:0,correct:0});b.attempts++;if(q.isCorrect)b.correct++;l.history.push({date:new Date().toISOString(),pattern:q.pattern,root:q.root,correct:q.isCorrect});data.history.push({date:new Date().toISOString(),arena:'listen',type:'quiz',note:`${midiName(q.root)} · ${PATTERNS[q.pattern].name}`,success:q.isCorrect});saveData();render()}
function nextListenQuestion(){const q=listeningQuiz;if(!q)return;if(q.index>=9){showListenResults();return}Object.assign(q,{index:q.index+1,pattern:randomPattern(),root:36+randomInt(0,59),answer:null,answerRoot:null,submitted:false,isCorrect:false,played:false,replaysLeft:data.replays});render()}
function showListenResults(){const q=listeningQuiz,pct=Math.round(q.correct/10*100);route='listen-results';app.innerHTML=shell(`${backLink('Listening Arena')}${heading('SESSION COMPLETE','Your listening results',`${q.correct} of 10 patterns identified correctly.`,true)}<div class="panel center"><p class="eyebrow violet">FINAL SCORE</p><div class="result-big">${pct}%</div><p class="muted">${q.correct} correct · ${10-q.correct} incorrect</p><div class="result-grid"><div class="stat"><div class="stat-value">10</div><div class="stat-label">Rounds</div></div><div class="stat"><div class="stat-value">${q.correct}</div><div class="stat-label">Correct</div></div><div class="stat"><div class="stat-value">${pct}%</div><div class="stat-label">Accuracy</div></div></div><div class="control-row" style="justify-content:center">${button('Another quiz','listen-quiz','btn violet')}${button('Back to arena','open-listen','btn ghost')}</div></div><div class="panel" style="margin-top:14px"><h3>Most confused patterns</h3>${topConfusion()}</div>`)}
function setRouteAction(action,el){switch(action){case'home':go('home');break;case'back':back();break;case'open-sing':go('arena-sing');break;case'open-listen':go('arena-listen');break;case'settings':go('settings');break;case'stats':go('stats');break;case'sing-practice':go('sing-practice');break;case'sing-quiz':if(route==='sing-quiz-results')singingQuiz=null;go('sing-quiz');break;case'listen-practice':go('listen-practice');break;case'listen-quiz':if(route==='listen-results')listeningQuiz=null;go('listen-quiz');break;case'sing-single':go('sing-single');break;case'sing-sequence':go('sing-sequence');break;case'sing-match':go('sing-match');break;case'quiz-single':activeExercise='single';go('sing-quiz-setup');break;case'quiz-sequence':activeExercise='sequence';go('sing-quiz-setup');break;case'quiz-match':activeExercise='match';go('sing-quiz-setup');break;case'onboarding':go('onboarding');break;case'edit-range':go('onboarding');break;case'skip-onboarding':data.onboarded=true;saveData();go('home');break;case'save-range':saveRange();break;case'range-low':measureRange('low');break;case'range-high':measureRange('high');break;case'start-single':startSingle();break;case'start-sequence':startSequence();break;case'start-match':startMatch();break;case'play-reference':playReference();break;case'stop-mic':stopMic();if(activeExercise)activeExercise.done=true;break;case'add-seq':addSequenceNote();break;case'remove-seq':sequence.splice(Number(el.dataset.index),1);render();break;case'clear-seq':sequence=[];render();break;case'play-pattern':{const k=el.dataset.pattern;stopAudio();showPatternStatus(k,'Loading piano…');const generation=audioGeneration;schedulePattern(Number(document.getElementById('listen-root')?.value||data.listenRoot),k,0,generation).then(ms=>{if(generation!==audioGeneration)return;if(ms>0){showPatternStatus(k,'Playing…');const done=setTimeout(()=>showPatternStatus(k,'Played'),ms);(window._sonicTimers ||= []).push(done)}else showPatternStatus(k,'Piano unavailable')});break}case'play-all-patterns':startPlayAll();break;case'stop-audio':stopAudio();Object.keys(PATTERNS).forEach(k=>showPatternStatus(k,'Stopped'));break;case'difficulty':data.quizDifficulty=el.dataset.value;saveData();render();break;case'start-listen-quiz':data.replays=Number(document.getElementById('replay-count')?.value??data.replays);saveData();startListenQuiz();break;case'replay-listen-question':playListenQuestion();break;case'answer-pattern':if(listeningQuiz&&!listeningQuiz.submitted){listeningQuiz.answer=el.dataset.pattern;render()}break;case'submit-listen-answer':submitListenAnswer();break;case'next-listen-question':nextListenQuestion();break;case'start-sing-quiz':if(!data.range.confirmed){toast('Set your comfortable vocal range before starting a generated quiz.');go('onboarding');break}saveData();startSingQuiz(activeExercise);break;case'start-quiz-mic':startQuizMic();break;case'stop-quiz-mic':stopQuizMic();break;case'quiz-play-reference':playQuizReference();break;case'next-sing-question':nextSingQuestion();break;case'reset-data':if(confirm('Reset all Sonic Lab settings, range and progress stored in this browser?')){stopMic();stopAudio();localStorage.removeItem(STORE);data=structuredClone(defaults);listeningQuiz=null;singingQuiz=null;go('home')}break;}}
app.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;setRouteAction(el.dataset.action,el)});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.notePart){noteSelection[t.dataset.notePart]=t.dataset.notePart==='octave'?Number(t.value):t.value;const disp=document.getElementById('target-note');if(disp)disp.textContent=labelFromSelection();const warning=document.getElementById('range-warning');if(warning)warning.style.display=data.range.confirmed&&!withinRange(midiFromSelection())?'block':'none';return}switch(t.id){case'listen-root':data.listenRoot=Number(t.value);saveData();render();break;case'listen-speed':data.playbackSpeed=Number(t.value);saveData();break;case'tolerance-setting':data.tolerance=Number(t.value);saveData();toast('Pitch tolerance updated.');break;case'sensitivity-setting':data.sensitivity=Number(t.value);saveData();break;case'default-root':data.listenRoot=Number(t.value);saveData();break;case'default-speed':data.playbackSpeed=Number(t.value);saveData();break;case'default-difficulty':data.quizDifficulty=t.value;saveData();break;case'default-replays':data.replays=Number(t.value);saveData();break;case'volume-setting':data.volume=Number(t.value);saveData();break;case'replay-count':data.replays=Number(t.value);saveData();break;case'answer-root':if(listeningQuiz)listeningQuiz.answerRoot=Number(t.value);break;case'quiz-root':break;}}
);
function addSequenceNote(){const m=midiFromSelection();sequence.push({midi:m,label:midiName(m)});render()}
function measureRange(which){const label=which==='low'?'range-low-display':'range-high-display';const out=document.getElementById(label);if(out)out.textContent='Listening…';startMic().then(ok=>{if(!ok)return;listenLoop(reading=>{if(reading){const m=reading.midi;if(out)out.textContent=reading.note;const input=document.getElementById(which==='low'?'range-low-input':'range-high-input');if(input)input.value=reading.note}})})}
function saveRange(){const low=parseNoteText(document.getElementById('range-low-input')?.value),high=parseNoteText(document.getElementById('range-high-input')?.value);if(!low||!high){toast('Enter notes like G2 or E4.');return}if(low.midi>=high.midi){toast('The highest note must be above the lowest note.');return}data.range={low:low.midi,high:high.midi,confirmed:true};data.onboarded=true;saveData();stopMic();toast('Comfortable vocal range saved.');go('arena-sing')}
// Handle range inputs without assuming the browser has MIDI or sheet-music support.
function updateNoteDisplay(){const el=document.getElementById('target-note');if(el)el.textContent=labelFromSelection()}
// Initial route: preserve a simple first-run nudge without blocking access to the app.
render();
if(!data.onboarded){const n=document.createElement('div');n.className='modal-backdrop';n.id='first-run';n.innerHTML=`<div class="modal"><p class="eyebrow">WELCOME TO SONIC LAB</p><h2>Let’s set your vocal range.</h2><p class="muted">The displayed G2–E4 values are examples, not a detected range. Measure your own comfortable low and high notes or enter them manually before starting generated singing quizzes.</p><div class="range-box"><div class="range-card"><span class="tiny">EXAMPLE LOW</span><strong>G2</strong></div><div class="range-card"><span class="tiny">EXAMPLE HIGH</span><strong>E4</strong></div></div><div class="modal-actions"><button class="btn ghost" id="first-skip">Skip for now</button><button class="btn primary" id="first-setup">Set up range</button></div></div>`;document.body.appendChild(n);document.getElementById('first-skip').onclick=()=>{data.onboarded=true;saveData();n.remove()};document.getElementById('first-setup').onclick=()=>{n.remove();go('onboarding')}};
})();
</script>
